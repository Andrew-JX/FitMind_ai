server {
    listen 80;
    listen [::]:80;
    server_name fitmind.jimmyuuu.com www.jimmyuuu.com;
    return 301 https://fitmind.jimmyuuu.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jimmyuuu.com;

    ssl_certificate /etc/letsencrypt/live/fitmind.jimmyuuu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitmind.jimmyuuu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://fitmind.jimmyuuu.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fitmind.jimmyuuu.com;

    ssl_certificate /etc/letsencrypt/live/fitmind.jimmyuuu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitmind.jimmyuuu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FitMindTLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no always;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
