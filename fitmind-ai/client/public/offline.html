<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f0f0f" />
    <title>当前网络不可用 - FitMind AI</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue",
          sans-serif;
      }

      body {
        align-items: center;
        background: #0f0f0f;
        color: #f0f0f0;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        display: grid;
        gap: 14px;
        max-width: 360px;
        text-align: center;
      }

      .mark {
        align-items: center;
        background: #c8f035;
        border-radius: 24px;
        color: #0f0f0f;
        display: inline-flex;
        font-size: 28px;
        font-weight: 800;
        height: 72px;
        justify-content: center;
        justify-self: center;
        width: 72px;
      }

      h1 {
        font-size: 22px;
        margin: 0;
      }

      p {
        color: #b8b8b8;
        font-size: 14px;
        line-height: 1.7;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">FM</div>
      <h1>当前网络不可用</h1>
      <p>
        请检查网络连接后重新打开 FitMind
        AI。训练数据需要联网同步，当前版本暂不支持离线保存。
      </p>
    </main>
  </body>
</html>
